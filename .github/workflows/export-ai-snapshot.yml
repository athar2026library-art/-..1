name: Export plain-text source for AI review

on:
  push:
    branches:
      - ai-review-plain-text-export
    paths-ignore:
      - "exports/ai-review/**"

permissions:
  contents: write

concurrency:
  group: ai-review-plain-text-export
  cancel-in-progress: false

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out export branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate uncompressed text exports
        run: python tools/export_for_ai.py

      - name: Commit generated text files
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/ai-review/*.txt
          if git diff --cached --quiet; then
            echo "No export changes."
            exit 0
          fi
          git commit -m "Generate plain-text source exports for AI review"
          git push origin "HEAD:${BRANCH_NAME}"
