name: Baqiyat validation

on:
  push:
    branches: [main, fix/baqiyat-secure-ai]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baqiyat-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Run the action-downloaded Gradle distribution directly; do not execute the unrecognized wrapper JAR.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          validate-wrappers: false

      # The Android Firebase client config is kept in GitHub Secrets, not in the public repository.
      # Accept either documented secret name so older repository settings remain compatible.
      - name: Configure Firebase for Android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_ANDROID_CONFIG_JSON: ${{ secrets.FIREBASE_ANDROID_CONFIG_JSON }}
        run: |
          set -euo pipefail
          CONFIG="${GOOGLE_SERVICES_JSON:-}"
          if [ -z "$CONFIG" ]; then
            CONFIG="${FIREBASE_ANDROID_CONFIG_JSON:-}"
          fi
          if [ -z "$CONFIG" ]; then
            echo "::error::Missing GOOGLE_SERVICES_JSON (or FIREBASE_ANDROID_CONFIG_JSON) GitHub Actions secret. Add the complete app/google-services.json contents as a repository Actions secret."
            exit 1
          fi
          printf '%s' "$CONFIG" > app/google-services.json
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync("app/google-services.json", "utf8"));
            if (!c.project_info?.project_id || !Array.isArray(c.client) || !c.client.length) {
              throw new Error("Firebase Android config is missing project_info.project_id or client entries");
            }
            const pkg = c.client.some(x => x.client_info?.android_client_info?.package_name === "com.baqiyat.azkar");
            if (!pkg) throw new Error("Firebase config has no Android client for package com.baqiyat.azkar");
            const key = c.client[0]?.api_key?.[0]?.current_key;
            if (!key || !key.startsWith("AIza")) throw new Error("Firebase config has no valid-looking current_key");
            console.log("Firebase Android config structure and package ID verified.");
          '

      - name: Check Android secret boundaries
        run: bash scripts/check-android-secrets.sh

      - name: Check patch whitespace
        run: git diff --check

      - name: Check admin panel JavaScript syntax
        run: node --check admin-panel/app.bundle.js

      - name: Validate Hisn al-Muslim dataset
        run: node scripts/check-hisn-al-muslim.mjs

      - name: Run Firestore security rules tests
        working-directory: firebase
        run: |
          npm ci
          npm run test:rules

      - name: Run Android unit tests and compile APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: baqiyat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run Cloud Functions tests
        working-directory: firebase/functions
        run: |
          npm install --ignore-scripts
          npm test
