name: Android validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/firebase-ai-tts-admin]

permissions:
  contents: read

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Provide non-secret Firebase config for compilation
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "baqiyat-ci-only",
              "storage_bucket": "baqiyat-ci-only.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                "android_client_info": {
                  "package_name": "com.baqiyat.azkar"
                }
              },
              "api_key": [{ "current_key": "AIzaSyDUMMY_FOR_CI_ONLY" }],
              "services": {
                "appinvite_service": { "other_platform_oauth_client": [] }
              }
            }],
            "configuration_version": "1"
          }
          JSON

      - name: Compile Android app
        run: gradle :app:compileDebugKotlin --no-daemon

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
