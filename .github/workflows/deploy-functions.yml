name: Deploy Firebase Functions

on:
  push:
    branches:
      - feature/private-admin-panel

permissions:
  contents: read

concurrency:
  group: deploy-firebase-functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-functions:
    name: Deploy Cloud Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_CREDENTIALS }}

      - name: Install function dependencies
        working-directory: firebase/functions
        run: npm ci

      - name: Validate function source
        working-directory: firebase/functions
        run: node --check index.js

      - name: Deploy Firebase Functions
        working-directory: firebase
        run: npx --yes firebase-tools deploy --only functions --project svrpmtt --non-interactive
