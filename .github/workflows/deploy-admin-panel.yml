name: Deploy owner panel to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "admin-panel/**"
      - ".github/workflows/deploy-admin-panel.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload owner panel
        uses: actions/upload-pages-artifact@v3
        with:
          path: admin-panel

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
